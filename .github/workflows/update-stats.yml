name: scheduled/update-stats

on:
  schedule:
    - cron: '30 0 * * *'  # Daily at 06:00 IST (00:30 UTC)
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats/stats_light.svg assets/stats/stats_dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update contribution stats [skip ci]"
          # prune-history rewrites the branch, so a stale ref is expected
          # rather than exceptional -- rebase once and retry.
          git push || (git pull --rebase origin "${{ github.ref_name }}" && git push)
